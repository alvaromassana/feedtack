name = "feedtack-api"
main = "src/index.js"
compatibility_date = "2026-07-01"

# Published on *.workers.dev. Add a route here if you want your own domain.

[vars]
DESTINO = "tu@correo.com"
REMITENTE = "Feedtack <feedtack@tudominio.com>"
# Origins allowed to send comments (CORS). One per review domain.
ORIGENES_PERMITIDOS = "https://staging.tucliente.com,http://localhost:8791"
# Notification batching: the first comment opens the window, and when it closes ONE email
# goes out with everything that landed. The count cut-off is the safety valve for a busy batch.
VENTANA_MINUTOS = "10"
CORTE_COMENTARIOS = "10"
# Where attachments too big for the email are downloaded from. It has to be a URL served
# by this worker; left empty, oversized attachments go out with no link.
BASE_PUBLICA = ""
# Language of the notification email YOU receive: "es" (default) or "en". The widget picks
# its own language from the page, this only changes the email.
EMAIL_LANG = "es"
# Timezone the email shows times in. Defaults to Europe/Madrid.
ZONA_HORARIA = "Europe/Madrid"

[[d1_databases]]
binding = "DB"
database_name = "feedtack"
database_id = "PON_AQUI_EL_TUYO"   # you get this from: wrangler d1 create feedtack

# Attachments live here: a deferred email cannot carry them in hand.
[[r2_buckets]]
binding = "ADJUNTOS"
bucket_name = "feedtack-adjuntos"   # you get this from: wrangler r2 bucket create feedtack-adjuntos

# One clock per site. No polling: with nobody commenting, nothing runs.
[[durable_objects.bindings]]
name = "TANDAS_DO"
class_name = "Tandas"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Tandas"]

# Secrets (wrangler secret put ...):
#   RESEND_API_KEY   your Resend key
#   CLAVE_ADMIN      the team key that allows resolving someone else's comment
#   TANDAS           set it to "no" to go back to one email per event, without deploying code
